spring.application.name=EnterpriseProcurementSystem

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_procurement_system
spring.datasource.username=root
spring.datasource.password=Root@123

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Application URL
# ===============================
app.base-url=http://localhost:8080

# ===============================
# Email Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail account used to send emails
spring.mail.username=enterpriseprocurementsystem@gmail.com

# Gmail App Password
# IMPORTANT: Replace this with your NEW App Password
# because the previous one was exposed.
spring.mail.password=gsvw sppl zeby ljqe

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Email Timeouts
# ===============================
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000